<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>CHANGE TITLE</title>
        <meta name="viewport" content="width=device-width" />
        <link rel="icon" sizes="16x16 32x32 48x48" type="image/png" href="/images/web_icon.png" />
        <link rel="stylesheet" href="styles.css">
        <script src="script.js"></script>
    </head>
    <body>
        <!-- header in header.html -->
        <div id="header"></div>
        
        <main>
            <!-------------------------- Doll Process -------------------------->
            <div alt="Justice">
                <div class="art-column-super-container">
                    
                    <div class="art-super-column">

                        <img 
                                src="images/process/justice/justice-final.png"
                                onclick="openImage(0)"
                                class="gallery-img"
                        />
                            
                    </div>
                    <div class="art-super-column">
                        <h3>Chroma Corps 2026 Entry</h3>
                        <div class="art-grid">
                                <div class="art-column">
                                    <img 
                                        src="images/process/justice/justice-exp-3.png" 
                                        onclick="openImage(1)"
                                        class="gallery-img"
                                    />

                                    <video width="400" controls
                                    class="gallery-img"
                                    >
                                    <source src="images/process/justice/justice-video.mp4" type="video/mp4">
                                    Your browser does not support HTML video.
                                    </video>
                                </div>

                                <div class="art-column">
                                    <img 
                                        src="images/process/justice/justice-exp-2.png"
                                        onclick="openImage(2)"
                                        class="gallery-img"
                                    />

                                    <img 
                                        src="images/process/justice/justice-exp-1.png"
                                        onclick="openImage(3)"
                                        class="gallery-img"
                                    />


                                </div>
                            </div>
                
                    </div>
                    <div id="lightbox" onclick="closeOnOutsideClick(event)">
                            <span class="close" onclick="closeImage()">&times;</span>

                            <button class="arrow prev" onclick="changeImage(-1)">&#10094;</button>

                            <img id="expanded-img">

                            <button class="arrow next" onclick="changeImage(1)">&#10095;</button>
                    </div>
                </div>
            </div>

            <!-------------------------- Paradise Process -------------------------->
            <div alt="Paradise">
                <div class="art-column-super-container">
                    
                    <div class="art-super-column">
                        <span class="text-right"><h3>Paradise</h3></span>
                            
                            <div class="art-grid">
                                <div class="art-column">
                                    <img 
                                        src="images/process/paradise/paradise-thumbs-1.png" 
                                        onclick="openImage(4)"
                                        class="gallery-img"
                                    />

                                    <img 
                                        src="images/process/paradise/paradise-thumbs-2.png"
                                        onclick="openImage(5)"
                                        class="gallery-img"
                                    />
                                </div>

                                <div class="art-column">
                                    <img 
                                        src="images/process/paradise/paradise-values.png"
                                        onclick="openImage(6)"
                                        class="gallery-img"
                                    />

                                    <video width="400" controls class="gallery-img"
                                    >
                                    <source src="images/process/paradise/paradise-video.mp4" type="video/mp4">
                                    Your browser does not support HTML video.
                                    </video>
                                </div>
                            </div>
                    </div>
                    <div class="art-super-column">
                            <img 
                                src="images/process/paradise/paradise-final.png"
                                onclick="openImage(7)"
                                class="gallery-img"
                            />
                    </div>
                    <div id="lightbox" onclick="closeOnOutsideClick(event)">
                            <span class="close" onclick="closeImage()">&times;</span>

                            <button class="arrow prev" onclick="changeImage(-1)">&#10094;</button>

                            <img id="expanded-img">

                            <button class="arrow next" onclick="changeImage(1)">&#10095;</button>
                    </div>
                </div>
            </div>
            <!-------------------------- Doll Process -------------------------->
            <div alt="Doll">
                <div class="art-column-super-container">
                    
                    <div class="art-super-column">

                        <img 
                                src="images/process/doll/doll-dying-final.png"
                                onclick="openImage(8)"
                                class="gallery-img"
                        />
                            
                    </div>
                    <div class="art-super-column">
                        <h3>Doll & Scissors</h3>
                        <div class="art-grid">
                                <div class="art-column">
                                    <img 
                                        src="images/process/doll/doll-dying-lineart.png" 
                                        onclick="openImage(9)"
                                        class="gallery-img"
                                    />

                                    <video width="400" controls class="gallery-img"
                                    >
                                    <source src="images/process/doll/doll-dying-video.mp4" type="video/mp4">
                                    Your browser does not support HTML video.
                                    </video>
                                </div>

                                <div class="art-column">
                                    <img 
                                        src="images/process/doll/doll-dying-color.png"
                                        onclick="openImage(10)"
                                        class="gallery-img"
                                    />

                                    <img 
                                        src="images/process/doll/doll-dying-wip.png"
                                        onclick="openImage(11)"
                                        class="gallery-img"
                                    />

                                </div>
                            </div>
                
                    </div>
                    <div id="lightbox" onclick="closeOnOutsideClick(event)">
                            <span class="close" onclick="closeImage()">&times;</span>

                            <button class="arrow prev" onclick="changeImage(-1)">&#10094;</button>

                            <img id="expanded-img">

                            <button class="arrow next" onclick="changeImage(1)">&#10095;</button>
                    </div>
                </div>
            </div>

        </main>

        <!-- footer in footer.html -->
        <div id="footer"></div>
    </body>



</html>
